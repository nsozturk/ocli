<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <title>How ocli works</title>
  <desc>The lead dispatches a slice with dispatch.mjs; the dispatcher starts a developer CLI in its JSON event mode, normalizes every event into a live file per run and records the result in the tree; the ocli-monitor plugin reads the live files and draws Workflow-style cards in Claude Code.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#0b0f19"/>
  <text x="60" y="56" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">How ocli works</text>
  <text x="60" y="84" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">One lead, many coding CLIs: every run streams into a file the Claude Code plugin draws live.</text>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="120" width="320" height="104" rx="12" fill="#151226" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="220" y="160" text-anchor="middle" font-size="22" font-weight="600" fill="#ede9fe">1 · Lead (Claude Code)</text>
    <text x="220" y="192" text-anchor="middle" font-size="16" fill="#a5b4fc">writes the spec, reviews, merges</text>

    <rect x="440" y="120" width="320" height="104" rx="12" fill="#0b1b22" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="600" y="160" text-anchor="middle" font-size="22" font-weight="600" fill="#cffafe">2 · dispatch.mjs</text>
    <text x="600" y="192" text-anchor="middle" font-size="16" fill="#67e8f9">starts the CLI, normalizes events</text>

    <rect x="820" y="120" width="320" height="104" rx="12" fill="#1f1012" stroke="#fb7185" stroke-width="1.5"/>
    <text x="980" y="160" text-anchor="middle" font-size="22" font-weight="600" fill="#ffe4e6">3 · Developer CLI</text>
    <text x="980" y="192" text-anchor="middle" font-size="16" fill="#fda4af">codex · opencode · agy · Muse</text>

    <rect x="60" y="340" width="320" height="104" rx="12" fill="#151226" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="220" y="380" text-anchor="middle" font-size="22" font-weight="600" fill="#ede9fe">6 · ocli-monitor pane</text>
    <text x="220" y="412" text-anchor="middle" font-size="16" fill="#a5b4fc">cards, phases, live warnings</text>

    <rect x="440" y="340" width="320" height="104" rx="12" fill="#0b1b22" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="600" y="380" text-anchor="middle" font-size="22" font-weight="600" fill="#cffafe">4 · orchestra/live</text>
    <text x="600" y="412" text-anchor="middle" font-size="16" fill="#67e8f9">one event file per run</text>

    <rect x="820" y="340" width="320" height="104" rx="12" fill="#0b1b22" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="980" y="380" text-anchor="middle" font-size="22" font-weight="600" fill="#cffafe">5 · tree + digest</text>
    <text x="980" y="412" text-anchor="middle" font-size="16" fill="#67e8f9">honest score, witness, summary</text>
  </g>

  <g stroke="#64748b" stroke-width="1.8" fill="none">
    <line x1="380" y1="172" x2="436" y2="172" marker-end="url(#a)"/>
    <line x1="760" y1="152" x2="816" y2="152" marker-end="url(#a)"/>
    <line x1="820" y1="194" x2="764" y2="194" marker-end="url(#a)"/>
    <line x1="600" y1="224" x2="600" y2="336" marker-end="url(#a)"/>
    <path d="M700 224 L700 280 L980 280 L980 336" marker-end="url(#a)"/>
    <line x1="440" y1="392" x2="384" y2="392" marker-end="url(#a)"/>
    <line x1="220" y1="340" x2="220" y2="228" marker-end="url(#a)"/>
  </g>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">
    <text x="788" y="114" text-anchor="middle">spawn</text>
    <text x="792" y="216" text-anchor="middle">JSON</text>
    <text x="612" y="290">live events</text>
    <text x="840" y="270">on exit</text>
    <text x="412" y="374" text-anchor="middle">reads</text>
    <text x="232" y="290">you watch</text>
  </g>
  <text x="60" y="508" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Purple: Claude Code side · Cyan: ocli dispatcher and its files · Rose: external coding CLIs</text>
</svg>
