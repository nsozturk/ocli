<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#161329"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <g fill="#1e293b" opacity="0.6">
    <circle cx="60" cy="40" r="1.5"/><circle cx="140" cy="300" r="1.5"/><circle cx="560" cy="60" r="1.5"/>
    <circle cx="620" cy="320" r="1.5"/><circle cx="1220" cy="30" r="1.5"/><circle cx="1240" cy="330" r="1.5"/>
  </g>

  <!-- left: wordmark, tagline, command chip -->
  <text x="72" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="96" font-weight="700" fill="url(#accent)">ocli</text>
  <text x="76" y="196" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#e2e8f0">Orchestrated CLI: one lead, many</text>
  <text x="76" y="228" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#e2e8f0">coding CLIs, live in Claude Code</text>
  <text x="76" y="262" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">Codex · opencode · Antigravity agy · Muse</text>
  <rect x="72" y="284" width="380" height="40" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#22d3ee">$ <tspan fill="#e2e8f0">dispatch.mjs --phase review</tspan></text>

  <!-- right: terminal window with a run card -->
  <rect x="610" y="34" width="610" height="292" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="638" cy="58" r="6" fill="#ff5f57"/><circle cx="658" cy="58" r="6" fill="#febc2e"/><circle cx="678" cy="58" r="6" fill="#28c840"/>
  <text x="915" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">ocli</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <rect x="634" y="80" width="562" height="228" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="654" y="108" fill="#e2e8f0" font-weight="700">fix-parser</text>
    <text x="1176" y="108" text-anchor="end" fill="#94a3b8">4m12s</text>
    <text x="654" y="134" fill="#94a3b8">ocli · <tspan fill="#a78bfa">Running</tspan></text>
    <text x="654" y="160" fill="#94a3b8">4 runs · 131k tokens</text>
    <text x="654" y="186" fill="#cbd5e1">Fix the tokenizer edge cases</text>
    <text x="654" y="216" fill="#64748b">Phases</text>
    <text x="654" y="242" fill="#e2e8f0">▸ implement <tspan fill="#22c55e">●●</tspan><tspan fill="#a78bfa">●</tspan> <tspan fill="#94a3b8">glm-5.3, codex</tspan></text>
    <text x="1176" y="242" text-anchor="end" fill="#94a3b8">2/3</text>
    <text x="674" y="266" fill="#64748b">↳ tool.end bash: npm test</text>
    <text x="654" y="292" fill="#e2e8f0">▸ review <tspan fill="#22c55e">●</tspan> <tspan fill="#94a3b8">muse</tspan></text>
    <text x="1176" y="292" text-anchor="end" fill="#94a3b8">1/1</text>
  </g>
